<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Orbit</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <link rel="stylesheet" th:href="@{/css/header.css}" href="/css/header.css">
    <link rel="stylesheet" th:href="@{/css/footer.css}" href="/css/footer.css">
    <link rel="stylesheet" th:href="@{/css/auth.css}" href="/css/auth.css">
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="auth-page">
        <div class="auth-card">
            <p class="hero-eyebrow">Bem-vindo de volta</p>
            <h1>Entrar no Orbit</h1>
            <p class="auth-subtitle">Acesse seus cenários salvos e o sandbox de gravidade.</p>

            <form id="loginForm" class="auth-form" novalidate>
                <label class="field">
                    <span>E-mail</span>
                    <input type="email" name="email" required autocomplete="email" placeholder="voce@exemplo.com">
                </label>

                <label class="field">
                    <span>Senha</span>
                    <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                </label>

                <a class="auth-forgot" th:href="@{/forgot-password}" href="forgot-password">Esqueceu a senha?</a>

                <button type="submit" class="btn btn-primary btn-large auth-submit">Entrar</button>
            </form>

            <p class="auth-switch">Não tem uma conta? <a th:href="@{/register}" href="register">Cadastre-se</a></p>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const email = this.email.value;
            const password = this.password.value;

            try {
                const response = await fetch("/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem("token", data.token);
                    window.location.href = "/scenarios";
                } else {
                    alert("Falha no login. Verifique suas credenciais.");
                }
            } catch (error) {
                alert("Erro ao fazer login: " + error.message);
            }
        });
    </script>
</body>
</html>
