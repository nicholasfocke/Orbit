<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${scenario.name + ' — Orbit'}">Scenario — Orbit</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <link rel="stylesheet" th:href="@{/css/header.css}" href="/css/header.css">
    <link rel="stylesheet" th:href="@{/css/footer.css}" href="/css/footer.css">
    <link rel="stylesheet" th:href="@{/css/scenarios.css}" href="/css/scenarios.css">
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="scenario-details">
        <span class="hero-eyebrow">Scenario details</span>
        <h1 class="section-title" th:text="${scenario.name}">Scenario name</h1>

        <div class="scenario-details-card">
            <dl class="planet-stats">
                <div><dt>Central body</dt><dd th:text="${scenario.centralBody}">Sun</dd></div>
                <div><dt>Bodies quantity</dt><dd th:text="${scenario.bodiesQuantity}">0</dd></div>
                <div><dt>Notes</dt><dd th:text="${scenario.notes}">—</dd></div>
            </dl>
        </div>

        <div class="scenario-details-actions">
            <a th:href="@{/sandbox}" href="sandbox" class="btn btn-primary">Open in sandbox</a>
            <a th:href="@{/scenarios}" href="scenarios" class="btn btn-ghost">Back to list</a>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
