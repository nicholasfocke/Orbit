<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha — Orbit</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <link rel="stylesheet" th:href="@{/css/header.css}" href="/css/header.css">
    <link rel="stylesheet" th:href="@{/css/footer.css}" href="/css/footer.css">
    <link rel="stylesheet" th:href="@{/css/auth.css}" href="/css/auth.css">
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="auth-page">
        <div class="auth-card" id="cardBefore">
            <p class="hero-eyebrow">Recuperação de conta</p>
            <h1>Redefina sua senha</h1>
            <p class="auth-subtitle">Digite seu e-mail e enviaremos um link de redefinição.</p>

            <form id="forgotForm" class="auth-form" novalidate>
                <label class="field">
                    <span>E-mail</span>
                    <input type="email" name="email" required autocomplete="email" placeholder="voce@exemplo.com">
                </label>

                <button type="submit" class="btn btn-primary btn-large auth-submit">Enviar link</button>
            </form>

            <p class="auth-switch"><a th:href="@{/login}" href="login">Voltar para o login</a></p>
        </div>

        <div class="auth-card" id="cardAfter" hidden>
            <p class="hero-eyebrow">Verifique sua caixa de entrada</p>
            <h1>Link enviado</h1>
            <p class="auth-subtitle">
                Se existir uma conta para <strong id="sentEmail"></strong>, um link
                para redefinir a senha está a caminho.
            </p>
            <a th:href="@{/login}" href="login" class="btn btn-ghost btn-large auth-submit">Voltar para o login</a>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script>
        // Página apenas visual: nenhum e-mail e enviado de verdade.
        // Ao enviar o formulario, so trocamos qual "cartao" aparece na tela.
        document.getElementById("forgotForm").addEventListener("submit", function (e) {
            e.preventDefault();
            const email = new FormData(e.target).get("email");
            document.getElementById("sentEmail").textContent = email;
            document.getElementById("cardBefore").hidden = true;
            document.getElementById("cardAfter").hidden = false;
        });
    </script>
</body>
</html>
