<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo — Orbit</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <link rel="stylesheet" th:href="@{/css/header.css}" href="/css/header.css">
    <link rel="stylesheet" th:href="@{/css/footer.css}" href="/css/footer.css">
    <link rel="stylesheet" th:href="@{/css/catalog.css}" href="/css/catalog.css">
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main>
        <section class="catalog-hero">
            <p class="hero-eyebrow">Catálogo de mundos</p>
            <h1 class="section-title">O Sistema Solar.</h1>
            <p class="catalog-intro">
                Oito planetas, com dados físicos reais, desenhados no seu navegador.
                Passe o mouse sobre um mundo para acelerá-lo.
            </p>
        </section>

        <section class="catalog-grid" id="catalogGrid">
            <article class="planet-card" th:each="planet : ${planets}">
                <canvas class="planet-canvas"
                        th:attr="data-color=${planet.color},data-rings=${planet.hasRings}"></canvas>
                <h3 th:text="${planet.name}">Nome do planeta</h3>
                <p class="planet-desc" th:text="${planet.description}">Descrição</p>
                <dl class="planet-stats">
                    <div><dt>Massa</dt><dd th:text="${planet.mass}">Massa</dd></div>
                    <div><dt>Distância do Sol</dt><dd th:text="${planet.distance}">Distância</dd></div>
                    <div><dt>Temperatura média</dt><dd th:text="${planet.temperature}">Temperatura</dd></div>
                    <div><dt>Duração do dia</dt><dd th:text="${planet.dayLength}">Dia</dd></div>
                </dl>
            </article>
        </section>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="/js/planet-viewer.js"></script>
    <script src="/js/catalog.js"></script>
</body>
</html>
