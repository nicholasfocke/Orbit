<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandbox — Orbit</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <link rel="stylesheet" th:href="@{/css/header.css}" href="/css/header.css">
    <link rel="stylesheet" th:href="@{/css/footer.css}" href="/css/footer.css">
    <link rel="stylesheet" th:href="@{/css/sandbox.css}" href="/css/sandbox.css">
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="sim-page">
        <div class="sim-heading">
            <p class="hero-eyebrow">Sandbox de gravidade</p>
            <h1>O Sistema Solar, em tempo real.</h1>
            <p class="sandbox-note">
                Cada planeta é puxado pela gravidade de todos os outros corpos.
                <span th:unless="${loggedIn}">Entre na sua conta para criar cenários e lançar seus próprios corpos.</span>
                <span th:if="${loggedIn}">Crie um cenário para lançar seus próprios corpos.</span>
            </p>
        </div>

        <div class="sim-area" id="sandboxCanvas" th:attr="data-url=@{/sandbox/bodies}"></div>

        <div class="sim-controls">
            <button type="button" class="btn btn-ghost" id="btnPausar">Pausar</button>
            <button type="button" class="btn btn-ghost" id="btnReiniciar">Reiniciar</button>
            <label class="sim-speed">
                Velocidade
                <input type="range" id="velocidadeTempo" min="1" max="20" value="4">
            </label>
            <a th:if="${loggedIn}" th:href="@{/scenarios/novo}" href="/scenarios/novo" class="btn btn-primary">Criar cenário</a>
            <a th:unless="${loggedIn}" th:href="@{/login}" href="/login" class="btn btn-primary">Entrar para criar</a>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="/js/sandbox.js"></script>
</body>
</html>
