<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar — Orbit</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <link rel="stylesheet" th:href="@{/css/header.css}" href="/css/header.css">
    <link rel="stylesheet" th:href="@{/css/footer.css}" href="/css/footer.css">
    <link rel="stylesheet" th:href="@{/css/auth.css}" href="/css/auth.css">
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main class="auth-page">
        <div class="auth-card">
            <p class="hero-eyebrow">Crie sua conta</p>
            <h1>Cadastre-se no Orbit</h1>
            <p class="auth-subtitle">Grátis — libera os detalhes do catálogo e o sandbox de gravidade.</p>

            <form id="registerForm" class="auth-form" novalidate>
                <label class="field">
                    <span>Nome</span>
                    <input type="text" name="name" required autocomplete="name" placeholder="Seu nome">
                </label>

                <label class="field">
                    <span>E-mail</span>
                    <input type="email" name="email" required autocomplete="email" placeholder="voce@exemplo.com">
                </label>

                <label class="field">
                    <span>Senha</span>
                    <input type="password" name="password" required minlength="6" autocomplete="new-password" placeholder="Pelo menos 6 caracteres">
                </label>

                <label class="field">
                    <span>Confirmar senha</span>
                    <input type="password" name="confirmPassword" required autocomplete="new-password" placeholder="••••••••">
                </label>

                <button type="submit" class="btn btn-primary btn-large auth-submit">Criar conta</button>
            </form>

            <p class="auth-switch">Já tem uma conta? <a th:href="@{/login}" href="login">Entrar</a></p>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script>
        document.getElementById("registerForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const fullName = this.name.value;
            const email = this.email.value;
            const password = this.password.value;
            const confirmPassword = this.confirmPassword.value;

            if (password !== confirmPassword) {
                alert("As senhas não coincidem!");
                return;
            }

            try {
                const response = await fetch("/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password, fullName })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem("token", data.token);
                    window.location.href = "/scenarios";
                } else {
                    alert("Falha no cadastro. Verifique seus dados.");
                }
            } catch (error) {
                alert("Erro ao cadastrar: " + error.message);
            }
        });
    </script>
</body>
</html>
